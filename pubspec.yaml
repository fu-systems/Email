name: look_in
description: >
  Look In - An open-source Linux email client inspired by Microsoft Outlook 2013.
  Features email (IMAP/SMTP/POP3), calendar, and contacts management with a
  classic ribbon-style interface.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management
  provider: ^6.1.1

  # Email
  enough_mail: ^2.1.7

  # Database (SQLite is bundled by the sqlite3 build hook)
  sqlite3: ^3.5.0
  path_provider: ^2.1.1
  path: ^1.8.3

  # UI utilities
  flutter_html: ^3.0.0
  flutter_html_table: ^3.0.0
  # flutter_html 3.0.0 imports package:html/src/query_selector.dart's
  # matches(), which html 0.15.7 removed.
  html: '>=0.15.4 <0.15.7'
  intl: ^0.20.2
  uuid: ^4.2.1
  shared_preferences: ^2.2.2
  file_picker: ^13.1.0
  collection: ^1.18.0
  url_launcher: ^6.2.2

  # Desktop notifications, the system keyring and the file transfer
  # portal (org.freedesktop.* over D-Bus)
  dbus: ^0.7.10
  # Password encryption and OAuth PKCE
  crypto: ^3.0.7
  pointycastle: ^4.0.0
  clock: ^1.1.3

  # Formatted message editor and its HTML export
  flutter_quill: ^11.6.0
  vsc_quill_delta_to_html: ^1.0.5
  # Files dragged onto the message window
  desktop_drop: ^0.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
