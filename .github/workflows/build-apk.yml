name: Build Android APK

on:
  push:
    branches: [ 'claude/**' , 'main' ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Flutter doctor
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build APK (release)
        run: flutter build apk --release 2>&1 | tee /tmp/build-output.txt; exit ${PIPESTATUS[0]}

      - name: Show build output on failure
        if: failure()
        run: cat /tmp/build-output.txt || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: look-in-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
