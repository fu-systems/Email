name: Build Android APK

on:
  push:
    branches: [ 'claude/**' , 'main' ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (release)
        id: build
        continue-on-error: true
        run: |
          flutter build apk --release 2>&1 | tee /tmp/build-output.txt
          echo "BUILD_EXIT_CODE=${PIPESTATUS[0]}" >> $GITHUB_ENV

      - name: Emit build errors as annotations
        if: env.BUILD_EXIT_CODE != '0'
        run: |
          echo "::group::Full Build Output"
          cat /tmp/build-output.txt
          echo "::endgroup::"
          # Extract and annotate error lines
          grep -i -E '(error|FAILURE|Exception|fatal)' /tmp/build-output.txt | head -20 | while IFS= read -r line; do
            echo "::error::$line"
          done
          # Commit the error log to the repo for access
          ERROR_CONTENT=$(cat /tmp/build-output.txt)
          echo "## Build Error Log" > /tmp/error-summary.md
          echo '```' >> /tmp/error-summary.md
          tail -80 /tmp/build-output.txt >> /tmp/error-summary.md
          echo '```' >> /tmp/error-summary.md
          cat /tmp/error-summary.md >> $GITHUB_STEP_SUMMARY

      - name: Upload build log on failure
        if: env.BUILD_EXIT_CODE != '0'
        uses: actions/upload-artifact@v4
        with:
          name: build-error-log
          path: /tmp/build-output.txt

      - name: Fail if build failed
        if: env.BUILD_EXIT_CODE != '0'
        run: exit 1

      - name: Upload APK artifact
        if: env.BUILD_EXIT_CODE == '0'
        uses: actions/upload-artifact@v4
        with:
          name: look-in-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
